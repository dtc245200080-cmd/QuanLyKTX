<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Phí</title>
        <link rel="stylesheet" href="../css/sinhvien.css">
    </head>
    <body>
        <div class="layout">
            <aside class="sidebar">
                <div class="brand">KTX-<span>ICTU</span></div>
                <div class="nav">
                    <a href="home.html">🏠 Trang chủ</a>
                    <a href="dangky.html">📝 Đăng ký ở</a>
                    <a href="chuyenphong.html">🔄 Chuyển phòng</a>
                    <a href="phi.html">💰 Phí</a>
                    <a href="phananh.html">⚠ Phản ánh</a>
                    <a href="chatbot.html">🤖 Chatbot</a>
                </div>
            </aside>
            <main class="content">
                <div class="topbar">
                    <h1>Phí & công nợ</h1>
                    <div class="user-box">
                        <span data-user></span> ·
                        <button class="btn btn-secondary" onclick="logout()">Đăng xuất</button>
                    </div>
                </div>
                <div class="grid">
                    <div class="card">
                        <h3>Tổng phí</h3>
                        <div class="number" id="feeTotal">0đ</div>
                    </div>
                    <div class="card">
                        <h3>Đã thu</h3>
                        <div class="number" id="feePaid">0đ</div>
                    </div>
                    <div class="card">
                        <h3>Còn nợ</h3>
                        <div class="number" id="feeDebt">0đ</div>
                    </div>
                </div>
                <div class="section">
                    <h2>Lịch sử khoản thu</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Tháng</th>
                                <th>Số tiền</th>
                                <th>Hạn</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="feeTable"></tbody>
                    </table>
                </div>
                <footer>KTX-ICTU © 2026</footer>
            </main>
        </div>
        <script src="../js/auth.js"></script>
        <script src="../js/sinhvien.js"></script>
    </body>
</html>
