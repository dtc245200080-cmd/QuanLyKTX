<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Đăng ký ở</title>
        <link rel="stylesheet" href="../css/sinhvien.css">
    </head>
    <body>
        <div class="layout">
            <aside class="sidebar">
                <div class="brand">KTX-<span>ICTU</span></div>
                <div class="nav">
                    <a href="home.html">🏠 Trang chủ</a>
                    <a href="dangky.html">📝 Đăng ký ở</a>
                    <a href="chuyenphong.html">🔄 Chuyển phòng</a>
                    <a href="phi.html">💰 Phí</a>
                    <a href="phananh.html">⚠ Phản ánh</a>
                    <a href="chatbot.html">🤖 Chatbot</a>
                </div>
            </aside>
            <main class="content">
                <div class="topbar">
                    <h1>Đăng ký ở</h1>
                    <div class="user-box">
                        <span data-user></span> ·
                        <button class="btn btn-secondary" onclick="logout()">Đăng xuất</button>
                    </div>
                </div>
                <div class="section">
                    <h2>Gửi yêu cầu</h2>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Phòng mong muốn</label>
                            <select id="desiredRoom">
                                <option>Đang tải...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Ghi chú</label>
                            <textarea id="requestNote" placeholder="Ghi chú nếu có"></textarea>
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="submitRequest('Đăng ký ở')">Gửi đăng ký</button>
                </div>
                <div class="section">
                    <h2>Lịch sử yêu cầu</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Loại</th>
                                <th>Hiện tại</th>
                                <th>Mong muốn</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="myStayBody"></tbody>
                    </table>
                </div>
                <footer>KTX-ICTU © 2026</footer>
            </main>
        </div>
        <script src="../js/auth.js"></script>
        <script src="../js/sinhvien.js"></script>
    </body>
</html>
