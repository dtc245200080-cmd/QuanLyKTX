<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Chatbot</title>
        <link rel="stylesheet" href="../css/sinhvien.css">
    </head>
    <body>
        <div class="layout">
            <aside class="sidebar">
                <div class="brand">KTX-<span>ICTU</span></div>
                <div class="nav">
                    <a href="home.html">🏠 Trang chủ</a>
                    <a href="dangky.html">📝 Đăng ký ở</a>
                    <a href="chuyenphong.html">🔄 Chuyển phòng</a>
                    <a href="phi.html">💰 Phí</a>
                    <a href="phananh.html">⚠ Phản ánh</a>
                    <a href="chatbot.html">🤖 Chatbot</a>
                </div>
            </aside>
            <main class="content">
                <div class="topbar">
                    <h1>Chatbot nội quy</h1>
                    <div class="user-box">
                        <span data-user></span> ·
                        <button class="btn btn-secondary" onclick="logout()">Đăng xuất</button>
                    </div>
                </div>
                <div class="section">
                    <p>Chatbot chỉ trả lời dựa trên nội quy thật đã được quản lý nhập vào hệ thống.</p>
                    <div id="chatBox">
                        <div class="notice">
                            <strong>KTX-ICTU:</strong> Hãy hỏi về nội quy KTX.
                        </div>
                    </div>
                    <input id="chatInput" placeholder="Ví dụ: KTX quy định giờ đóng cửa như thế nào?">
                    <button class="btn btn-primary" onclick="sendChat()">Gửi</button>
                </div>
                <footer>KTX-ICTU © 2026</footer>
            </main>
        </div>
        <script src="../js/auth.js"></script>
        <script src="../js/sinhvien.js"></script>
    </body>
</html>
