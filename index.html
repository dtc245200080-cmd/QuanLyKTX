<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KTX-ICTU - Đăng nhập</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="logo">
      <h1>KTX-ICTU</h1>
      <p>Hệ thống quản lý ký túc xá thông minh</p>
    </div>
    <form onsubmit="login(event)">
      <div class="form-group">
        <label>Quyền đăng nhập</label>
        <select id="role">
          <option value="sinhvien">Sinh viên</option>
          <option value="quanly">Quản lý KTX</option>
          <option value="ketoan">Kế toán</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tài khoản</label>
        <input id="username" required placeholder="Nhập tài khoản">
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input id="password" type="password" required placeholder="Nhập mật khẩu">
      </div>
      <button class="btn btn-primary" type="submit">Đăng nhập</button>
      <div id="error" class="error"></div>
    </form>
  </div>
</div>
<script src="js/auth.js"></script>
</body>
</html>
