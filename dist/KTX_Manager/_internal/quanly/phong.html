<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý phòng</title><link rel="stylesheet" href="../css/quanly.css"></head><body><div class="layout"><aside class="sidebar"><div class="brand">KTX-<span>ICTU</span></div><div class="nav"><a href="home.html">🏠 Trang chủ</a><a href="sinhvien.html">👨‍🎓 Sinh viên</a><a href="luutru.html">🛏 Lưu trú</a><a href="hopdong.html">📄 Hợp đồng</a><a href="taichinh.html">💰 Tài chính</a><a href="phananh.html">⚠ Phản ánh</a><a href="phong.html">🚪 Phòng</a><a href="noiquy.html">📚 Nội quy</a><a href="thongke.html">📊 Thống kê</a></div></aside><main class="content"><div class="topbar"><h1>Tòa nhà & phòng</h1><div class="user-box"><span data-user></span> · <button class="btn btn-secondary" onclick="logout()">Đăng xuất</button></div></div><div class="section"><h2>Tòa nhà</h2><div class="actions"><button class="btn btn-primary" onclick="showBuildingForm()">+ Thêm tòa</button></div><div id="buildingForm" style="display:none"><div class="form-grid"><input id="buildingCode" placeholder="Mã tòa"><input id="buildingName" placeholder="Tên tòa"><input id="buildingFloors" type="number" min="1" placeholder="Số tầng"></div><button class="btn btn-primary" onclick="createBuilding()">Lưu</button> <button class="btn btn-secondary" onclick="hideBuildingForm()">Hủy</button></div><table><thead><tr><th>Mã</th><th>Tên</th><th>Số tầng</th><th>Số phòng</th></tr></thead><tbody id="buildingBody"><tr><td colspan="4">Đang tải...</td></tr></tbody></table></div><div class="section"><h2>Phòng</h2><div class="actions"><button class="btn btn-primary" onclick="showRoomForm()">+ Thêm phòng</button><button class="btn btn-secondary" onclick="loadRooms()">↻ Làm mới</button></div><div id="roomForm" style="display:none"><div class="form-grid"><input id="roomCode" placeholder="Mã phòng"><select id="roomBuilding"><option value="">-- Chọn tòa --</option></select><input id="roomCapacity" type="number" min="1" placeholder="Sức chứa"><input id="roomFloor" type="number" min="1" placeholder="Tầng"><select id="roomGender"><option>Nam/Nữ</option><option>Nam</option><option>Nữ</option></select></div><button class="btn btn-primary" onclick="createRoom()">Lưu</button> <button class="btn btn-secondary" onclick="hideRoomForm()">Hủy</button></div><table><thead><tr><th>Phòng</th><th>Tòa</th><th>Tầng</th><th>Sức chứa</th><th>Đang ở</th><th>Trống</th><th>Trạng thái</th></tr></thead><tbody id="roomTableBody"><tr><td colspan="7">Đang tải...</td></tr></tbody></table></div><footer>KTX-ICTU © 2026</footer></main></div><script src="../js/auth.js"></script><script src="../js/quanly.js"></script><script>async function loadBuildingTable(){const b=document.getElementById('buildingBody');try{const rows=await api('/rooms/buildings');b.innerHTML=rows.length?rows.map(x=>`<tr><td>${escapeHtml(x.code)}</td><td>${escapeHtml(x.name)}</td><td>${x.floors}</td><td>${x.room_count}</td></tr>`).join(''):'<tr><td colspan="4">Chưa có tòa.</td></tr>'}catch(e){b.innerHTML=`<tr><td colspan="4">${escapeHtml(e.message)}</td></tr>`}}const oldLoadBuildings=loadBuildings;loadBuildings=async()=>{await oldLoadBuildings();await loadBuildingTable()};document.addEventListener('DOMContentLoaded',loadBuildingTable);</script></body></html>
