<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Nội quy</title>
        <link rel="stylesheet" href="../css/quanly.css">
    </head>
    <body>
        <div class="layout">
            <aside class="sidebar">
                <div class="brand">KTX-<span>ICTU</span></div>
                <div class="nav">
                    <a href="home.html">🏠 Trang chủ</a>
                    <a href="sinhvien.html">👨‍🎓 Sinh viên</a>
                    <a href="phong.html">🚪 Phòng</a>
                    <a href="luutru.html">🛏 Lưu trú</a>
                    <a href="hopdong.html">📄 Hợp đồng</a>
                    <a href="taichinh.html">💰 Tài chính</a>
                    <a href="phananh.html">⚠ Phản ánh</a>
                    <a href="noiquy.html">📚 Nội quy</a>
                    <a href="thongke.html">📊 Thống kê</a>
                </div>
            </aside>
            <main class="content">
                <div class="topbar">
                    <h1>Kho nội quy thật</h1>
                    <div class="user-box">
                        <span data-user></span> ·
                        <button class="btn btn-secondary" onclick="logout()">Đăng xuất</button>
                    </div>
                </div>
                <div class="section">
                    <p>Nhập đúng nội dung nội quy do trường/KTX cung cấp. Chatbot sẽ chỉ dùng các nội dung này để trả lời.</p>
                    <table>
                        <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Tiêu đề</th>
                                <th>Nội dung</th>
                                <th>Trạng thái</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="policyBody"></tbody>
                    </table>
                </div>
                <div class="section">
                    <h2>Thêm nội quy</h2>
                    <div class="form-grid">
                        <input id="policyCode" placeholder="Ví dụ QD01">
                        <input id="policyTitle" placeholder="Tiêu đề">
                        <textarea id="policyContent" placeholder="Nội dung nội quy thật" style("grid-column:1/-1")></textarea>
                    </div>
                    <button class="btn btn-primary" onclick="createPolicy()">Lưu nội quy</button>
                </div>
            </main>
        </div>
        <footer>KTX-ICTU © 2026</footer>

        <script src="../js/auth.js"></script>
        <script src="../js/quanly.js"></script>
    </body>
</html>
