<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sinh viên</title>
        <link rel="stylesheet" href="../css/quanly.css">
    </head>
    <body>
        <div class="layout">
            <aside class="sidebar">
                <div class="brand">KTX-<span>ICTU</span></div>
                <div class="nav">
                    <a href="home.html">🏠 Trang chủ</a>
                    <a href="sinhvien.html">👨‍🎓 Sinh viên</a>
                    <a href="phong.html">🚪 Phòng</a>
                    <a href="luutru.html">🛏 Lưu trú</a>
                    <a href="hopdong.html">📄 Hợp đồng</a>
                    <a href="taichinh.html">💰 Tài chính</a>
                    <a href="phananh.html">⚠ Phản ánh</a>
                    <a href="noiquy.html">📚 Nội quy</a>
                    <a href="thongke.html">📊 Thống kê</a>
                </div>
            </aside>
            <main class="content">
                <div class="topbar">
                    <h1>Quản lý sinh viên</h1>
                    <div class="user-box">
                        <span data-user></span> ·
                        <button class="btn btn-secondary" onclick="logout()">Đăng xuất</button>
                    </div>
                </div>
                <div class="section">
                    <h2>Danh sách sinh viên</h2>
                    <button class="btn btn-primary" onclick="showStudentForm()">+ Thêm sinh viên</button>
                    <div id="studentForm" style="display:none;margin-top:15px">
                        <div class="form-grid">
                            <input id="studentMssv" placeholder="MSSV">
                            <input id="studentName" placeholder="Họ và tên">
                            <input id="studentClass" placeholder="Lớp">
                            <input id="studentPhone" placeholder="Số điện thoại">
                            <input id="studentPassword" type="password" placeholder="Mật khẩu đăng nhập (mặc định 123456)">
                        </div>
                        <button class="btn btn-primary" onclick="createStudent()">Lưu</button>
                        <button class="btn btn-secondary" onclick="hideStudentForm()">Hủy</button>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th>MSSV</th>
                                <th>Họ tên</th>
                                <th>Lớp</th>
                                <th>SĐT</th>
                                <th>Phòng</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody"></tbody>
                    </table>
                </div>
                <footer>KTX-ICTU © 2026</footer>
            </main>
        </div>
        <script src="../js/auth.js"></script>
        <script src="../js/quanly.js"></script>
    </body>
</html>
